machine:
  environment:
    XCODE_PROJECT:  missing
    XCODE_SCHEME:   missing

  pre:
    - sudo apt-get install curl
    - sudo apt-get install ncftp
    - curl -O http://octadecimal.com/scripts/install-haxe.sh
    - sudo bash install-haxe.sh -y

test:
  override:
    - haxe build.hxml
    - neko test.n

deployment:
    master:
        branch: master
        commands:
            - ncftpput -R -v -u "$FTP_USER" -p "$FTP_PASS" $FTP_HOST /neatocasino bin