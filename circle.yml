machine:
  environment:
    XCODE_PROJECT:  missing
    XCODE_SCHEME:   missing

  pre:
    - sudo bash hx-neato-core/scripts/install-haxe.sh -y
    - sudo apt-get install ncftp
	- haxelib install msignal --always || true
	- haxelib install actuate --always || true
	- haxelib install pixijs --always || true

test:
  override:
    #- haxe runtests-ci.hxml

deployment:
    master:
        branch: master
        commands:
            - haxe build-production.hxml
            - ncftpput -R -v -u "$FTP_USER" -p "$FTP_PASS" $FTP_HOST /neatocasino bin/production
    develop:
        branch: develop
        commands:
            - haxe build.hxml
            - ncftpput -R -v -u "$FTP_USER" -p "$FTP_PASS" $FTP_HOST /neatocasino bin/develop